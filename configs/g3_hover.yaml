# Gate 3 smoke run: nominal hover with the NumPy stub dynamics.
# Goal: prove train -> save -> reload -> evaluate end to end, before Andy's
# 6-DOF model and Joe's fault module are ready.
#
# Inherits everything from base.yaml and overrides only what differs. The
# dynamics values below are STUB values, not the agreed vehicle parameters —
# they are the one thing that has to change once Andy's CAD numbers exist.

extends: base.yaml

status: g3-smoke

run:
  name: g3_stub_hover
  seed: 0
  device: cpu
  total_timesteps: 200000
  n_envs: 4

dynamics:
  # STUB. Symmetric X with CoM-to-rotor distance L = 0.092 m:
  # position = (+-L/sqrt(2), +-L/sqrt(2)) = +-0.06505382386916236 m.
  # Full precision on purpose: these values must reproduce the 200k reference
  # run exactly, and a rounded position is enough to diverge after 200k steps.
  # Replace all six values with Andy's CAD measurements at G1.
  rotor_positions_body_m:
    - [ 0.06505382386916236, -0.06505382386916236]   # R0 front-right
    - [ 0.06505382386916236,  0.06505382386916236]   # R1 front-left
    - [-0.06505382386916236,  0.06505382386916236]   # R2 rear-left
    - [-0.06505382386916236, -0.06505382386916236]   # R3 rear-right
  mass_kg: 0.5
  inertia_kgm2: [0.004, 0.004, 0.008]
  thrust_max_per_rotor_n: 2.0
  thrust_curve: linear
  drag_torque_ratio_m: 0.02
  motor_time_constant_s: 0.0
  linear_drag_n_per_mps: 0.05
  angular_drag_nm_per_radps: 0.005

ppo:
  policy: MlpPolicy
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]

evaluation:
  episodes: 20
  seed_start: 100000
