# Gate 3 smoke run: nominal hover with the NumPy stub dynamics.
# Goal: prove train -> save -> reload -> evaluate end to end, before Andy's
# 6-DOF model and Joe's fault module are ready.  Physics values here are STUB
# values, not the agreed vehicle parameters.

schema_version: 1
status: g3-smoke

run:
  name: g3_stub_hover
  seed: 0
  device: cpu
  total_timesteps: 200000
  n_envs: 4

env:
  physics_hz: 240
  control_hz: 60
  episode_length_s: 10.0
  target_position: [0.0, 0.0, 1.0]

reset:
  position_jitter_m: 0.10
  velocity_jitter_mps: 0.10
  tilt_jitter_deg: 2.0
  yaw_jitter_deg: 5.0

observation:
  history_len: 10
  normalize: true
  clip: 10.0
  scales:
    position_error: 1.0
    linear_velocity: 1.0
    attitude_quaternion: 1.0
    angular_velocity: 10.0
    last_motor_command: 1.0

action:
  dim: 4
  low: 0.0
  high: 1.0

reward:
  alive: 1.0
  position_error: 1.0
  linear_velocity: 0.1
  action_rate: 0.01
  angular_rate_xy: 0.001
  crash: -100.0
  out_of_bounds: -100.0

termination:
  crash_z: 0.05
  max_xy_radius: 5.0
  max_z: 3.0
  tilt_limit_deg: null
  use_ground_contact: false

dynamics:
  # STUB values for G3 only.  Replace with Andy's parameters at G1.
  mass_kg: 0.5
  arm_length_m: 0.092          # must match ROTOR_ARM_M in envs/interface.py
  inertia_kgm2: [0.004, 0.004, 0.008]
  thrust_max_per_rotor_n: 2.0
  thrust_curve: linear
  drag_torque_ratio_m: 0.02
  motor_time_constant_s: 0.0
  linear_drag_n_per_mps: 0.05
  angular_drag_nm_per_radps: 0.005

faults:
  enabled: true
  mode: nominal                # nominal | fixed | random
  fixed:
    rotor_id: 0
    failure_time_s: 4.0
    effectiveness: 0.0
  random:
    rotor_id: [0, 1, 2, 3]
    failure_time_s: [2.0, 8.0]
    effectiveness: 0.0

seeds:
  train: [0, 999]
  eval: [100000, 100999]

ppo:
  policy: MlpPolicy
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]

evaluation:
  episodes: 20
  seed_start: 100000
