# Gate 0 interface config — canonical nominal run.
# Draft (2026-10-25). See docs/INTERFACE.md; settle at the 28 Oct meeting.
# One file per run; no code in configs. Values marked TBD are owned by the named person.

schema_version: 1
status: proposed

run:
  name: base
  seed: 0

env:
  physics_hz: 240          # Andy's integrator rate
  control_hz: 60           # policy rate; exactly 4 physics steps per action
  episode_length_s: 10.0   # 600 control steps
  target_position: [0.0, 0.0, 1.0]   # hold point, world ENU, m

observation:
  history_len: 10          # frames stacked oldest -> newest
  normalize: true
  clip: 10.0               # clip after dividing by the scales
  # Per-field normalisation scales (the same order as the observation layout).
  scales:
    position_error: 1.0        # m
    linear_velocity: 1.0       # m/s
    attitude_quaternion: 1.0   # unit quaternion
    angular_velocity: 10.0     # rad/s
    last_motor_command: 1.0    # normalised [0, 1]

action:
  dim: 4
  low: 0.0
  high: 1.0

reward:
  alive: 1.0
  position_error: 1.0      # weight on ||p_target - p||^2
  linear_velocity: 0.1     # weight on ||v||^2
  action_rate: 0.01        # weight on ||u_t - u_{t-1}||^2
  angular_rate_xy: 0.001   # weight on roll/pitch rates; yaw is NOT penalised
  crash: -100.0
  out_of_bounds: -100.0

termination:
  crash_z: 0.05            # CoM below this -> crash, m
  max_xy_radius: 5.0       # horizontal distance from origin, m
  max_z: 3.0               # m
  tilt_limit_deg: null     # unused in v1: yaw spin is allowed
  use_ground_contact: false  # TBD: Andy/Joe decide whether PyBullet contacts are used

dynamics:
  # Owned by Andy (G1). Null means "not agreed yet"; the G3 stub may use provisional
  # values locally but must not commit them as the interface.
  mass_kg: null
  arm_length_m: null       # CoM to rotor axis; rotors at (+-L/sqrt(2), +-L/sqrt(2))
  inertia_kgm2: null       # [Ixx, Iyy, Izz]
  thrust_max_per_rotor_n: null
  thrust_curve: linear     # f = T_max * u_applied
  drag_torque_ratio_m: null  # kappa = rotor torque / thrust, N*m/N
  motor_time_constant_s: 0.0  # first-order lag; 0 = ideal actuator

faults:
  enabled: true
  mode: nominal            # nominal | fixed | random
  fixed:
    rotor_id: 0            # 0..3, see docs/rotor_layout.svg
    failure_time_s: 4.0    # quantised to the control grid by the environment
    effectiveness: 0.0     # complete loss
  random:
    rotor_id: [0, 1, 2, 3]
    failure_time_s: [2.0, 8.0]
    effectiveness: 0.0
    initial_position_jitter_m: 0.05
    initial_velocity_jitter_mps: 0.05
    initial_tilt_jitter_deg: 2.0

seeds:
  train: [0, 999]
  eval: [100000, 100999]
