<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowCW" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowCCW" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c05621"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="470" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#1a202c">Body frame (FLU), top view</text>
  <text x="240" y="50" text-anchor="middle" font-size="13" fill="#4a5568">
    x forward (up on the page) · y left · z out of the page
  </text>

  <!-- arms -->
  <g stroke="#a0aec0" stroke-width="7" stroke-linecap="round">
    <line x1="240" y1="240" x2="325" y2="155"/>
    <line x1="240" y1="240" x2="155" y2="155"/>
    <line x1="240" y1="240" x2="155" y2="325"/>
    <line x1="240" y1="240" x2="325" y2="325"/>
  </g>

  <!-- body -->
  <rect x="200" y="200" width="80" height="80" rx="10"
        fill="#f7fafc" stroke="#2d3748" stroke-width="2.5"/>
  <circle cx="240" cy="240" r="4" fill="#2d3748"/>
  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#4a5568">CoM</text>

  <!-- axes -->
  <line x1="240" y1="235" x2="240" y2="105" stroke="#4a5568" stroke-width="1.8"
        marker-end="url(#arrowGrey)"/>
  <text x="249" y="118" font-size="13" fill="#2d3748">+x forward</text>
  <line x1="235" y1="240" x2="105" y2="240" stroke="#4a5568" stroke-width="1.8"
        marker-end="url(#arrowGrey)"/>
  <text x="100" y="234" text-anchor="end" font-size="13" fill="#2d3748">+y left</text>
  <text x="240" y="392" text-anchor="middle" font-size="12" fill="#4a5568">
    +z out of the page (spin sign is defined in this view)
  </text>

  <!-- R0 front-right, CW -->
  <g transform="translate(325,155)">
    <circle r="34" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
    <text y="-3" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">R0</text>
    <text y="16" text-anchor="middle" font-size="12" fill="#2b6cb0">CW (−1)</text>
    <path d="M -36,-24 A 43,43 0 0 1 36,-24" fill="none" stroke="#2b6cb0"
          stroke-width="1.8" marker-end="url(#arrowCW)"/>
  </g>

  <!-- R1 front-left, CCW -->
  <g transform="translate(155,155)">
    <circle r="34" fill="#fffaf0" stroke="#c05621" stroke-width="2.5"/>
    <text y="-3" text-anchor="middle" font-size="16" font-weight="bold" fill="#7b341e">R1</text>
    <text y="16" text-anchor="middle" font-size="12" fill="#c05621">CCW (+1)</text>
    <path d="M 36,-24 A 43,43 0 0 0 -36,-24" fill="none" stroke="#c05621"
          stroke-width="1.8" marker-end="url(#arrowCCW)"/>
  </g>

  <!-- R2 rear-left, CW -->
  <g transform="translate(155,325)">
    <circle r="34" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
    <text y="-3" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">R2</text>
    <text y="16" text-anchor="middle" font-size="12" fill="#2b6cb0">CW (−1)</text>
    <path d="M -36,-24 A 43,43 0 0 1 36,-24" fill="none" stroke="#2b6cb0"
          stroke-width="1.8" marker-end="url(#arrowCW)"/>
  </g>

  <!-- R3 rear-right, CCW -->
  <g transform="translate(325,325)">
    <circle r="34" fill="#fffaf0" stroke="#c05621" stroke-width="2.5"/>
    <text y="-3" text-anchor="middle" font-size="16" font-weight="bold" fill="#7b341e">R3</text>
    <text y="16" text-anchor="middle" font-size="12" fill="#c05621">CCW (+1)</text>
    <path d="M 36,-24 A 43,43 0 0 0 -36,-24" fill="none" stroke="#c05621"
          stroke-width="1.8" marker-end="url(#arrowCCW)"/>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#2d3748">
    <circle cx="52" cy="421" r="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="66" y="425">CW (spin −1): R0 front-right, R2 rear-left</text>
    <circle cx="52" cy="445" r="6" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
    <text x="66" y="449">CCW (spin +1): R1 front-left, R3 rear-right</text>
  </g>
</svg>
